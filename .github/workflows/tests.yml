name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy gemmi rdkit
      - run: python scripts/test_regressions.py
      - run: python scripts/test_dials_helpers.py
      - run: python scripts/test_solution_helpers.py
